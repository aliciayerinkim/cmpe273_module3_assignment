syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckInventory(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckResponse {
  string item_id = 1;
  int32 requested = 2;
  int32 in_stock = 3;
  bool available = 4;
}
